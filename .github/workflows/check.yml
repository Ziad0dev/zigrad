name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # Mondays: mutation-test every exercise

jobs:
  exercises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mutation testing diffs against the base
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Icarus Verilog, for Part VII's hardware
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Every exercise fails, every solution passes and is zig fmt clean
        run: tools/verify.sh
      - name: Generated files are up to date
        run: git diff --exit-code exercises hard solutions
      - name: Every error points at a ??? hole
        run: python3 tools/check_holes.py
      - name: Every allowlisted mutant matches exactly one hole
        run: python3 tools/check_allowlist.py
      - name: The build runner passes on the solutions
        run: zig build -Dsolutions
      - name: The one-file example
        run: zig test examples/tinygrad_in_one_file.zig
      - name: The final project's compiler
        run: zig test project/minicompiler.zig
      - name: Formatting
        run: zig fmt --check build.zig examples project
      - name: Mutation testing, on the templates this change touches
        if: github.event_name != 'schedule'
        run: |
          base="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base=HEAD~1; fi
          python3 tools/mutate.py --since "$base"
      - name: Mutation testing, every exercise
        if: github.event_name == 'schedule'
        run: python3 tools/mutate.py
